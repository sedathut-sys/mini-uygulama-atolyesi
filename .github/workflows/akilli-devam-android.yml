name: Akilli Devam Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'akilli-devam-android/**'
      - '.github/workflows/akilli-devam-android.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: akilli-devam-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true
      - name: Decision tests
        run: |
          mkdir -p /tmp/akilli-tests
          javac -d /tmp/akilli-tests app/src/main/java/com/akillidevam/app/Decision.java tests/DecisionTest.java
          java -cp /tmp/akilli-tests com.akillidevam.app.DecisionTest
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Build unsigned release
        run: gradle --no-daemon :app:assembleRelease
      - name: Sign and verify APK
        env:
          KEYSTORE_B64: ${{ secrets.AKILLI_DEVAM_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.AKILLI_DEVAM_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/akilli-release.p12"
          trap 'rm -f "$KEY"' EXIT
          if [[ -n "$KEYSTORE_B64" && -n "$KEYSTORE_PASSWORD" ]]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$KEY"
            echo "Persistent signing key"
          elif [[ -z "$KEYSTORE_B64" && -z "$KEYSTORE_PASSWORD" ]]; then
            KEYSTORE_PASSWORD="$(openssl rand -hex 24)"
            echo "::add-mask::$KEYSTORE_PASSWORD"
            export KEYSTORE_PASSWORD
            keytool -genkeypair -storetype PKCS12 -keystore "$KEY" -storepass:env KEYSTORE_PASSWORD -alias akillidevam -keyalg RSA -keysize 3072 -validity 3650 -dname "CN=Akilli Devam Test Release"
            echo "One-build test release key; not a permanent update identity"
          else
            echo "Incomplete signing secrets"; exit 1
          fi
          BT="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p delivery
          "$BT/zipalign" -f -v 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$KEY" --ks-key-alias akillidevam --ks-pass env:KEYSTORE_PASSWORD --out delivery/Akilli-Devam-Android-v0.2.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --verbose --print-certs delivery/Akilli-Devam-Android-v0.2.apk
          "$BT/zipalign" -c -v 4 delivery/Akilli-Devam-Android-v0.2.apk
          "$BT/aapt" dump badging delivery/Akilli-Devam-Android-v0.2.apk
          sha256sum delivery/Akilli-Devam-Android-v0.2.apk
      - name: Upload verified release APK
        uses: actions/upload-artifact@v4
        with:
          name: Akilli-Devam-Android-v0.2-APK
          path: akilli-devam-android/delivery/Akilli-Devam-Android-v0.2.apk
          if-no-files-found: error
          retention-days: 7
      - name: Enable KVM for emulator
        run: |
          test -e /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-akilli-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 16 installation smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb shell getprop ro.build.version.sdk | grep -x 36
            adb install akilli-devam-android/delivery/Akilli-Devam-Android-v0.2.apk
            adb shell pm path com.akillidevam.app
            adb shell am start -W -n com.akillidevam.app/.MainActivity
            adb shell pidof com.akillidevam.app
